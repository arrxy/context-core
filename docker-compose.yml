services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: contextcore-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: contextcore

    ports:
      - "5432:5432"

    volumes:
      - pgvector-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contextcore"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgvector-data: